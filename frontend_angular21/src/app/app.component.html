<main class="page">
  <header class="header">
    <h1>Bowling Score Tracker</h1>
    <button class="reset-btn" (click)="resetGame()" [disabled]="loading()">
      {{ loading() ? 'Loading...' : 'New Game' }}
    </button>
  </header>

  @if (errorMessage(); as error) {
    <div class="error" role="alert">
      <strong>Error:</strong> {{ error }}
    </div>
  }

  @if (state(); as gameState) {
    <app-scoreboard [state]="gameState" />

    <app-pin-controls
      [state]="gameState"
      [loading]="loading()"
      (rollPins)="roll($event)" />

    <app-roll-history [rolls]="gameState.rolls" />
  }
</main>
